[workspace]
resolver = "2"
members = [
    "cmd/aob-cli",
    "cmd/workflow-optimiser",
    "cmd/api-rust",
    "crates/dag-optimizer",
    "common/mover",
]

# Workspace-wide dependencies (optional - for sharing versions)
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
