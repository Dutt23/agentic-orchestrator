[package]
name = "mover"
version = "0.1.0"
edition = "2021"
authors = ["Orchestrator Team"]
description = "Ultra-fast data mover with io_uring and zero-copy (Linux only)"

# IMPORTANT: This crate requires Linux kernel 5.1+
# io_uring is Linux-specific and will NOT compile on macOS/Windows
# For macOS development: Use Docker or test without mover (USE_MOVER=false)

[dependencies]
# Cross-platform dependencies
# Serialization (for now, will add MessagePack later)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Lazy static for HTTP runtime
once_cell = "1.19"

# URL parsing for HTTP client
url = "2.5"

# HTTP parsing
httparse = "1.8"

# Linux-only dependencies (io_uring, splice, etc.)
[target.'cfg(target_os = "linux")'.dependencies]
# Monoio - pure io_uring runtime (ByteDance, exposes raw FDs for splice)
# Provides IoBuf trait for proper buffer ownership and send_zc support
monoio = "0.2"
monoio-compat = "0.2"

# For true splice() syscalls (zero-copy)
nix = { version = "0.27", features = ["socket", "poll", "fs"] }
libc = "0.2"

# Memory mapping
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true  # Small binary

[profile.release.build-override]
opt-level = 0  # Fast builds
