# ============================================================================
# YAML Anchors - DRY Configuration Templates
# ============================================================================

# Mover service template (reusable for all movers)
x-mover-template: &mover-template
  build:
    context: ..
    dockerfile: docker/Dockerfile.mover
  environment:
    IOURING_ENTRIES: ${IOURING_ENTRIES:-4096}
    IOURING_FLAGS: ${IOURING_FLAGS:-clamp}
    DATABASE_URL: postgres://${DB_USER:-orchestrator}:${DB_PASSWORD:-orchestrator}@postgres:5432/${DB_NAME:-orchestrator}
  cap_add:
    - IPC_LOCK        # Required for io_uring buffer registration
    - SYS_RESOURCE    # Required for io_uring setup and memory locking
    - NET_ADMIN       # Required for TCP tuning (optional)
  security_opt:
    - seccomp:unconfined  # Disable seccomp to allow io_uring syscalls
  # Kernel TCP tuning for high-performance networking
  sysctls:
    - net.core.somaxconn=8192                    # More pending connections
    - net.ipv4.tcp_fin_timeout=15                # Faster FIN-WAIT cleanup (15s vs 60s)
    - net.ipv4.tcp_tw_reuse=2                    # Reuse TIME_WAIT ports (KEY FIX!)
    - net.ipv4.tcp_fastopen=3                    # TCP Fast Open (skip handshake)
    - net.ipv4.ip_local_port_range=10000 65535  # More ephemeral ports (55k vs 28k)
  networks:
    - orchestrator-net
  profiles:
    - mover  # Only starts with: docker-compose --profile mover up
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 256M

# ============================================================================
# Services
# ============================================================================

services:
  # ═══════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════════════════════════

  postgres:
    image: postgres:15-alpine
    container_name: orchestrator-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-orchestrator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orchestrator}
      POSTGRES_DB: ${DB_NAME:-orchestrator}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-orchestrator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: orchestrator-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - orchestrator-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  # ═══════════════════════════════════════════════════════════
  # CONTROL PLANE
  # ═══════════════════════════════════════════════════════════

  # Mover for orchestrator (uses template)
  mover-orchestrator:
    <<: *mover-template  # Inject common config
    container_name: mover-orchestrator
    environment:
      MOVER_SOCKET: /tmp/mover-orchestrator.sock
      SERVICE_NAME: orchestrator
      # Inherit from template: DATABASE_URL, IOURING_*, etc.
      DATABASE_URL: postgres://${DB_USER:-orchestrator}:${DB_PASSWORD:-orchestrator}@postgres:5432/${DB_NAME:-orchestrator}
      IOURING_ENTRIES: ${IOURING_ENTRIES:-4096}
      IOURING_FLAGS: ${IOURING_FLAGS:-clamp}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mover-orchestrator-socket:/tmp

  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_NAME: orchestrator
    container_name: orchestrator-api
    volumes:
      - mover-orchestrator-socket:/tmp  # Share socket with mover
    environment:
      # Database (orchestrator uses POSTGRES_ prefix)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_NAME:-orchestrator}
      POSTGRES_USER: ${DB_USER:-orchestrator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orchestrator}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Mover (ultra-fast I/O layer)
      USE_MOVER: ${USE_MOVER:-false}
      MOVER_SOCKET: /tmp/mover-orchestrator.sock

      # Service config
      PORT: 8081
      GOMAXPROCS: 4
      GOMEMLIMIT: 1GiB

      # Optional
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orchestrator-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 256M

  # Mover for workflow-runner
  mover-workflow:
    <<: *mover-template
    container_name: mover-workflow
    environment:
      MOVER_SOCKET: /tmp/mover-workflow.sock
      SERVICE_NAME: workflow-runner
      DATABASE_URL: postgres://${DB_USER:-orchestrator}:${DB_PASSWORD:-orchestrator}@postgres:5432/${DB_NAME:-orchestrator}
      IOURING_ENTRIES: ${IOURING_ENTRIES:-4096}
      IOURING_FLAGS: ${IOURING_FLAGS:-clamp}
      HTTP_HANDLER_MODE: ${HTTP_HANDLER_MODE:-buffered}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mover-workflow-socket:/tmp

  workflow-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_NAME: workflow-runner
        NEEDS_SCRIPTS: "true"
    container_name: orchestrator-workflow-runner
    volumes:
      - mover-workflow-socket:/tmp  # Share socket with mover
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DB_NAME:-orchestrator}
      POSTGRES_USER: ${DB_USER:-orchestrator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orchestrator}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Orchestrator API
      ORCHESTRATOR_URL: http://orchestrator:8081

      # Mover (ultra-fast I/O layer)
      USE_MOVER: ${USE_MOVER:-false}
      MOVER_SOCKET: /tmp/mover-workflow.sock

      # Test server (for performance testing)
      ENABLE_TEST_SERVER: ${ENABLE_TEST_SERVER:-false}
      TEST_PORT: "8082"
      PERF_TEST_TOKEN: ${PERF_TEST_TOKEN:-perf-test-unsafe-default-token}

      # Service config
      PORT: 8082
      GOMAXPROCS: 4
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8082:8082"  # Only needed when ENABLE_TEST_SERVER=true
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
    networks:
      - orchestrator-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 256M

  # ═══════════════════════════════════════════════════════════
  # WORKER PLANE
  # ═══════════════════════════════════════════════════════════

  # Mover for http-worker (no Postgres - http-worker doesn't use CAS)
  mover-http:
    <<: *mover-template
    container_name: mover-http
    environment:
      MOVER_SOCKET: /tmp/mover-http.sock
      SERVICE_NAME: http-worker
      MOVER_ENABLE_POSTGRES: "false"  # Don't waste resources on unused DB connection
      IOURING_ENTRIES: ${IOURING_ENTRIES:-4096}
      IOURING_FLAGS: ${IOURING_FLAGS:-clamp}
    volumes:
      - mover-http-socket:/tmp

  http-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_NAME: http-worker
        NEEDS_SCRIPTS: "true"
    volumes:
      - mover-http-socket:/tmp  # Share socket with mover
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Mover
      USE_MOVER: ${USE_MOVER:-false}
      MOVER_SOCKET: /tmp/mover-http.sock

      PORT: 8083
      GOMAXPROCS: 2
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orchestrator-net
    restart: unless-stopped
    deploy:
      replicas: ${HTTP_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M

  # Mover for hitl-worker (no Postgres - hitl-worker doesn't use CAS)
  mover-hitl:
    <<: *mover-template
    container_name: mover-hitl
    environment:
      MOVER_SOCKET: /tmp/mover-hitl.sock
      SERVICE_NAME: hitl-worker
      MOVER_ENABLE_POSTGRES: "false"  # Don't waste resources on unused DB connection
      IOURING_ENTRIES: ${IOURING_ENTRIES:-4096}
      IOURING_FLAGS: ${IOURING_FLAGS:-clamp}
    volumes:
      - mover-hitl-socket:/tmp

  hitl-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_NAME: hitl-worker
        NEEDS_SCRIPTS: "true"
    container_name: orchestrator-hitl-worker
    volumes:
      - mover-hitl-socket:/tmp  # Share socket with mover
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Mover
      USE_MOVER: ${USE_MOVER:-false}
      MOVER_SOCKET: /tmp/mover-hitl.sock

      PORT: 8084
      GOMAXPROCS: 2
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orchestrator-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M

  agent-runner:
    build:
      context: ..
      dockerfile: cmd/agent-runner-py/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8086
      ORCHESTRATOR_URL: http://orchestrator:8081
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orchestrator-net
    restart: unless-stopped
    deploy:
      replicas: ${AGENT_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ═══════════════════════════════════════════════════════════
  # STREAMING PLANE
  # ═══════════════════════════════════════════════════════════

  fanout:
    build:
      context: ..
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_NAME: fanout
    container_name: orchestrator-fanout
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8085
      GOMAXPROCS: 4
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8085:8085"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orchestrator-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 256M

  # ═══════════════════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════════════════

  frontend:
    build:
      context: ../frontend/flow-builder
      dockerfile: Dockerfile
    container_name: orchestrator-frontend
    ports:
      - "3000:80"
    environment:
      VITE_ORCHESTRATOR_URL: ${VITE_ORCHESTRATOR_URL:-http://localhost:8081}
      VITE_FANOUT_URL: ${VITE_FANOUT_URL:-ws://localhost:8085}
      VITE_DEV_USERNAME: ${DEV_USERNAME:-test-user}
    depends_on:
      - orchestrator
      - fanout
    networks:
      - orchestrator-net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # Mover sockets (for sidecar pattern)
  mover-orchestrator-socket:
    driver: local
  mover-workflow-socket:
    driver: local
  mover-http-socket:
    driver: local
  mover-hitl-socket:
    driver: local

networks:
  orchestrator-net:
    driver: bridge
